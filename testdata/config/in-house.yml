name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: example-org/deploy-action@v2
        with:
          environment: production
      - name: Comment the deploy URL
        run: ./scripts/pr-comment.sh "$PR_NUMBER" "deployed"
